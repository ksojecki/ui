schema: spec-driven

context: |
  @ksojecki/ui is a published React component library with daisyUI themes and semantic purpose
  props. AGENTS.md and docs/AGENTS.md are the rules for design and implementation.
  Write every artifact in English. Name spec capabilities after the export group they describe,
  e.g. ui-actions, ui-forms, ui-overlays, ui-themes.
  Consumers are ksojecki/web-projects apps and ksojecki/sojecki.pl (docs at sojecki.pl/ui).
  This repository moves into ksojecki/web-platform at packages/ui. A change that also needs work in
  web-projects, web-platform or transport_map belongs in the ksojecki store (ksojecki/openspec).

rules:
  proposal:
    - State whether the public API changes and which semver bump the release needs.
  design:
    - Use semantic purpose props and theme tokens, never fixed colours; cover light and dark themes.
    - Never plan modules or folders named utils, common, helpers or misc.
  tasks:
    - Include tests next to the changed components and a keyboard and screen reader check.
    - Include the docs/ page update for every added or changed component.
    - End with pnpm lint, pnpm format:check, pnpm typecheck, pnpm test, pnpm build and pnpm pack.
