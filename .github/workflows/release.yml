name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          runtime: node@26.13.1
          cache: true
          install: false
      - name: Verify tag and branch
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          expected_tag="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$expected_tag" ]; then
            printf 'Expected tag %s, got %s\n' "$expected_tag" "$TAG" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish library
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/github-packages.npmrc"
          printf '%s\n' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          case "${TAG%%+*}" in
            *-*) npm publish --tag next ;;
            *) npm publish ;;
          esac
